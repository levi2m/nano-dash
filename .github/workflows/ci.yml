name: ci

on:
  push:
    branches: [main]   # pull requests are checked by the pull_request trigger
    paths: [android/**, .github/workflows/**]   # docs-only pushes need no build or release
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit hashes (the comment names the version); Dependabot moves them.
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Test, lint and build
        run: ./gradlew :core:test :app:lintDebug :wear:lintDebug :app:assembleDebug :app:assembleRelease :wear:assembleRelease --console=plain

  # Only this job holds a write token and the signing key, and only on a push to main after the tests passed.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}   # releases publish in order
      cancel-in-progress: false
    env:
      # Only a yes/no: whether the key is stored as a repository secret. The secrets themselves appear in the "Release key" step alone.
      RELEASE: ${{ secrets.KEYSTORE_B64 != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.RELEASE == 'true'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        if: env.RELEASE == 'true'
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK platform
        if: env.RELEASE == 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        if: env.RELEASE == 'true'
      - name: Release key
        if: env.RELEASE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=nanodash\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" > keystore.properties
      - name: Build the signed release
        if: env.RELEASE == 'true'
        run: ./gradlew :app:assembleRelease :wear:assembleRelease -PversionCode=${{ github.run_number }} --console=plain
      - name: Publish release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)-${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "nano-dash-$tag.apk"
          cp wear/build/outputs/apk/release/wear-release.apk "nano-dash-wear-$tag.apk"
          gh release create "$tag" "nano-dash-$tag.apk" "nano-dash-wear-$tag.apk" --target "$GITHUB_SHA" --generate-notes
