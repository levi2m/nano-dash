name: ci

on:
  push:
    branches: [main]   # pull requests are checked by the pull_request trigger
    paths: [android/**, .github/workflows/**]   # docs-only pushes need no build or release
  pull_request:

permissions:
  contents: write   # to publish releases; pull requests from forks still get a read-only token

jobs:
  build:
    runs-on: ubuntu-24.04
    concurrency:
      group: build-${{ github.ref }}   # runs on one branch queue, so releases publish in order
      cancel-in-progress: false
    env:
      # Signing and publishing switch on only when the key is stored as a repository secret.
      RELEASE: ${{ secrets.KEYSTORE_B64 != '' }}
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v5
      - name: Release key
        if: env.RELEASE == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=nanodash\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" > keystore.properties
          echo SIGNED=1 >> "$GITHUB_ENV"
      - name: Test, lint and build
        run: ./gradlew :core:test :app:lintDebug :app:assembleDebug :app:assembleRelease -PversionCode=${{ github.run_number }} --console=plain
      - name: Publish release
        if: env.SIGNED
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)-${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "nano-dash-$tag.apk"
          gh release create "$tag" "nano-dash-$tag.apk" --target "$GITHUB_SHA" --generate-notes
