name: Bug report
description: Something did not work on a ride or with the camera
labels: [bug]
body:
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: "Samsung Galaxy S25 Ultra, Android 17"
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Camera and firmware version
      placeholder: "Osmo Nano, v01.00.0000"
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App version (release tag, or the build number at the bottom of the app)
      placeholder: "v0.1.0-46"
    validations:
      required: true
  - type: input
    id: watch
    attributes:
      label: Watch and Wear OS version (only if the watch remote is involved)
      placeholder: "Galaxy Watch6 Classic"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: "What you did, what you expected, what you saw. Do not post precise GPS tracks you want kept private."
    validations:
      required: true
