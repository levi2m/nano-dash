# F-Droid build recipe for Nano Dash, as submitted to fdroiddata (metadata/io.github.levi2m.nanodash.yml there).
# It is NOT used by this repository's own build. Reproducible: F-Droid rebuilds the tagged release, checks it is
# byte-for-byte the GitHub APK (Binaries) and then ships that APK with our signature (AllowedAPKSigningKeys), so
# GitHub and F-Droid installs update over each other. docs/FDROID.md has the local test and how to add a release.
# Keep `versionName` equal to nanodash.versionName in android/gradle.properties. The listing comes from fastlane/.

Categories:
  - Camera
  - Sports & Health
License: Apache-2.0
AuthorName: levi2m
WebSite: https://github.com/levi2m/nano-dash
SourceCode: https://github.com/levi2m/nano-dash
IssueTracker: https://github.com/levi2m/nano-dash/issues
Changelog: https://github.com/levi2m/nano-dash/releases

AutoName: Nano Dash

RepoType: git
Repo: https://github.com/levi2m/nano-dash.git
Binaries: https://github.com/levi2m/nano-dash/releases/download/v%v-%c/nano-dash-v%v-%c.apk

Builds:
  - versionName: 0.1.0
    versionCode: 58
    commit: 143248c47f3da127f730c23fd240528d3226454b
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
      - update-alternatives --auto java
    gradle:
      - yes
    gradleprops:
      - versionCode=58

AllowedAPKSigningKeys: b728abd0c4634f976f2e77c213100331bc448aca608c0687eb24916d97e3b4f2

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 0.1.0
CurrentVersionCode: 58
